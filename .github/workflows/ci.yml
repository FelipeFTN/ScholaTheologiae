name: CI

on:
  pull_request:
  push:
    branches: [ master, main ]

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    # The Rails application lives in app/, so the run steps and ruby/setup-ruby
    # resolve .ruby-version, Gemfile, Gemfile.lock and bin/ from there.
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          working-directory: app
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        # bin/brakeman prepends --ensure-latest, which fails the job as soon as a
        # newer brakeman exists. The pinned gem is the one CI should trust.
        run: bundle exec brakeman --no-pager

  scan_js:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          working-directory: app
          bundler-cache: true

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

  lint:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          working-directory: app
          bundler-cache: true

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y build-essential git libyaml-dev pkg-config

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          working-directory: app
          bundler-cache: true

      - name: Run tests
        env:
          RAILS_ENV: test
        # There are no ActiveRecord models or migrations yet, so the test database
        # has no schema to prepare.
        run: bin/rails test

      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshots
          path: ${{ github.workspace }}/app/tmp/screenshots
          if-no-files-found: ignore

  api:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: api

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: Install SQLite headers
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libsqlite3-dev

      - name: Vet the API
        run: go vet -tags sqlite_fts5 ./...

      - name: Build the API
        run: CGO_ENABLED=1 go build -tags sqlite_fts5 -o bin/schola-theologiae-api main.go
